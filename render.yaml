services:
  - type: web
    name: dns-simulator
    runtime: python
    rootDir: backend
    buildCommand: bash ../scripts/render-build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: NODE_VERSION
        value: "22"
      - key: SERVE_STATIC
        value: "1"
